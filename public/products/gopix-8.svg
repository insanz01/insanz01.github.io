<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#111715"/>
  <!-- Minimalist smartphone silhouette -->
  <rect x="225" y="55" width="150" height="310" rx="18" fill="#090D0C" stroke="#28302C" stroke-width="3"/>
  <!-- Camera visor (Pixel style) -->
  <rect x="225" y="102" width="150" height="34" fill="#1A211E"/>
  <circle cx="268" cy="119" r="9" fill="#090D0C" stroke="#3B4640" stroke-width="2"/>
  <circle cx="300" cy="119" r="9" fill="#090D0C" stroke="#3B4640" stroke-width="2"/>
  <circle cx="334" cy="119" r="4" fill="#B7FF3C"/>
  <!-- Subtle screen line indicator -->
  <line x1="252" y1="65" x2="252" y2="355" stroke="#B7FF3C" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="300" y="405" text-anchor="middle" fill="#AAB2AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">GOPIX 8 · TOKOPEDIA</text>
</svg>
